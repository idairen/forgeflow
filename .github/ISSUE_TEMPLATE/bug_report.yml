name: Bug report
description: Report a reproducible ForgeFlow defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets. Report security vulnerabilities through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: ForgeFlow version or commit
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Execution surface
      options:
        - Python CLI
        - npx installer
        - Codex IDE launcher
        - Copilot IDE launcher
        - Markdown protocol only
        - Documentation or example
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node version, Adapter, host version, model, and mode as relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted evidence
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed secrets and personal data.
          required: true
        - label: I distinguished automated validation from real Agent-host execution.
          required: true
