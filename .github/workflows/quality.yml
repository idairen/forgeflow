name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-core:
    name: Python ${{ matrix.python-version }} core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ForgeFlow
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile Python sources
        run: python -m compileall -q forgeflow
      - name: Smoke-test Python CLI
        run: python -m forgeflow --help
      - name: Run core and repository contract tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  npm-installer:
    name: Node ${{ matrix.node-version }} installer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "22"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run npx installer tests
        run: npm test
      - name: Verify npm package contents
        run: npm pack --dry-run --json > npm-pack.json
